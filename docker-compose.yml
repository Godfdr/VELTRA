version: '3.8'
services:
  veltra-postgres:
    image: postgres:16-alpine
    container_name: veltra_postgres
    environment:
      POSTGRES_USER: veltra_admin
      POSTGRES_PASSWORD: production_db_secure_password_2026
      POSTGRES_DB: veltra_ledger
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: ["veltra-mesh"]
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }

  veltra-redis:
    image: redis:7.2-alpine
    container_name: veltra_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    networks: ["veltra-mesh"]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

  veltra-mongodb:
    image: mongo:7.0
    container_name: veltra_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: veltra_ai_user
      MONGO_INITDB_ROOT_PASSWORD: production_mongo_secure_password_2026
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]
    networks: ["veltra-mesh"]
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1.5G }

volumes:
  pgdata: { driver: local }
  redisdata: { driver: local }
  mongodata: { driver: local }

networks:
  veltra-mesh: { driver: bridge }
